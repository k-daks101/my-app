@if (showThankYou()) {
  <section class="thank-you-page" aria-labelledby="thank-you-title">
    <div class="thank-you-icon" aria-hidden="true">&#10003;</div>
    <h1 id="thank-you-title">Thank you for submitting</h1>
    <p>Your feedback has been received.</p>
    <button class="thank-you-button" type="button" (click)="startNewFeedback()">
      Start new feedback
    </button>
  </section>
} @else {
  <section class="background">
    <app-theme [hidden]="currentStep().id !== 1" (next)="saveThemes($event)"></app-theme>
    <app-method
      [hidden]="currentStep().id !== 2"
      (next)="saveMethod($event.method, $event.message, $event.uploads)"
      (back)="previousStep()"
    ></app-method>
    <app-feedbacktype
      [hidden]="currentStep().id !== 3"
      (next)="saveShareDetails($event.shareMode, $event.name, $event.email, $event.phone)"
      (back)="previousStep()"
    ></app-feedbacktype>
    <app-review
      [hidden]="currentStep().id !== 4"
      [feedback]="feedback()"
      [isSubmitting]="isSubmitting()"
      [submissionError]="submissionError()"
      [submissionComplete]="submissionComplete()"
      (back)="previousStep()"
      (edit)="editStep($event)"
      (submitFeedback)="submitFeedback()"
    ></app-review>
  </section>
}
